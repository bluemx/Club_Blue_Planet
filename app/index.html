<!doctype html>
<html lang="es">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>">

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: <%= process.env.API_ORIGIN || 'https://clubblueplanet.ealbinu.workers.dev http://localhost:8787' %>; connect-src 'self' <%= process.env.API_ORIGIN || 'https://clubblueplanet.ealbinu.workers.dev http://localhost:8787' %><% if (ctx.dev) { %> ws://localhost:*<% } %>;<% if (ctx.dev) { %> worker-src 'self' blob:;<% } %>"
    />

    <!-- Brand colour for the mobile browser chrome and Android task switcher -->
    <meta name="theme-color" content="#1467E4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Club Blue Planet">
    <meta name="application-name" content="Club Blue Planet">

    <!-- Link previews -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Club Blue Planet">
    <meta property="og:title" content="Club Blue Planet">
    <meta property="og:description" content="<%= productDescription %>">
    <meta property="og:image" content="https://clubblueplanet-app.ealbinu.workers.dev/og-image.png">
    <meta property="og:url" content="https://clubblueplanet-app.ealbinu.workers.dev/">
    <meta property="og:locale" content="es_MX">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Club Blue Planet">
    <meta name="twitter:description" content="<%= productDescription %>">
    <meta name="twitter:image" content="https://clubblueplanet-app.ealbinu.workers.dev/og-image.png">

    <!-- Small sizes use the planet alone: the full lockup turns to mush at 16px -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
